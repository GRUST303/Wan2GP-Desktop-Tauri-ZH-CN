name: Validate localization plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python plugin syntax
        run: python -m py_compile plugin.py

      - name: Validate plugin metadata JSON
        run: python -c "import json; json.load(open('plugin_info.json', encoding='utf-8')); print('plugin_info.json OK')"

      - name: Validate Chinese locale JSON packs
        run: |
          python - <<'PY'
          import glob, json
          for path in sorted(glob.glob('locales/zh_CN*.json')):
              pack = json.load(open(path, encoding='utf-8'))
              assert isinstance(pack.get('exact', {}), dict)
              assert isinstance(pack.get('attributes', {}), dict)
              assert isinstance(pack.get('patterns', []), list)
              assert isinstance(pack.get('pure_overrides', {}), dict)
              assert isinstance(pack.get('fragments', {}), dict)
              print(path, 'OK')
          PY

      - name: Validate localization JavaScript
        run: node --check web/localization.js

      - name: Validate assembled injected JavaScript
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          js = Path('web/localization.js').read_text(encoding='utf-8')
          js = js.replace('__LOCALE__', json.dumps({"exact":{},"attributes":{},"patterns":[],"pure_overrides":{},"fragments":{}}))
          js = js.replace('__PLUGIN_VERSION__', '0.0.0-test')
          Path('/tmp/wangp-zh-plugin.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/wangp-zh-plugin.js

      - name: Validate Tauri localization JavaScript
        run: node --check tauri_patch/src/i18n-zh-cn.js
